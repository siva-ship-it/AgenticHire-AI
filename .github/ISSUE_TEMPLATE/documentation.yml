name: Documentation improvement
description: Report missing, incorrect, or unclear documentation
title: "docs: "
labels: [documentation]
body:
  - type: input
    id: location
    attributes: { label: Page or file }
    validations: { required: true }
  - type: textarea
    id: issue
    attributes: { label: What is unclear or incorrect? }
    validations: { required: true }
  - type: textarea
    id: suggestion
    attributes: { label: Suggested improvement }
