name: Feature request
description: Propose an outcome-aligned product change
title: "feat: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What recruiter or candidate problem needs solving? }
    validations: { required: true }
  - type: textarea
    id: outcome
    attributes: { label: Desired outcome, description: Describe observable success without prescribing implementation. }
    validations: { required: true }
  - type: textarea
    id: spec
    attributes: { label: Spec impact, description: Which business rules belong under specs/? }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, placeholder: "- [ ] …" }
    validations: { required: true }
